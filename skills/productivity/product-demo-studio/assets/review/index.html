<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Product demo review</title><link rel="stylesheet" href="app.css"></head>
<body>
<header class="topbar"><a id="brand" class="brand" href="#">Product demo</a><div class="top-actions"><select id="locale" aria-label="Video language"></select><select id="format" aria-label="Video format"></select><button id="copy">Copy link</button></div></header>
<main class="workspace"><aside class="rail"><div class="rail-heading" id="heading">Video versions</div><nav id="versions" aria-label="Video versions"></nav><p id="hint" class="rail-note">Choose a version or scroll to the next film.</p></aside><section class="viewer"><div class="viewer-bar"><span id="counter"></span><span id="swipe">Scroll or swipe to compare</span><button id="sound" aria-pressed="false">Enable sound</button></div><div id="feed" class="feed" tabindex="0" aria-label="Video list"></div><div class="bottom"><button id="prev">↑ Previous</button><span id="status" role="status" aria-live="polite"></span><button id="next">Next ↓</button></div></section></main>
<noscript>Enable JavaScript to choose and play a film.</noscript><script type="module" src="app.js"></script>
</body></html>
